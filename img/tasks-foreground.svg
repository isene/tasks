<?xml version="1.0" encoding="UTF-8"?>
<!--
  Foreground-only icon for Android adaptive icons. Designed in a
  108×108 viewport with content kept inside the central 66×66 dp
  "safe zone" so launchers that crop aggressively still show the
  whole hyperlist.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <g fill="#FFFFFF">
    <!-- Category bar -->
    <rect x="26" y="34" width="58" height="8"  rx="3"/>
    <!-- Items, indented two notches -->
    <rect x="38" y="50" width="46" height="6"  rx="2.5"/>
    <rect x="38" y="62" width="38" height="6"  rx="2.5"/>
    <rect x="38" y="74" width="32" height="6"  rx="2.5"/>
  </g>
  <!-- Accent dot on the category -->
  <circle cx="78" cy="38" r="2.2" fill="#FFE3B0"/>
</svg>
