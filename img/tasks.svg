<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#B7410E"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square background (squircle approximation) -->
  <rect x="8" y="8" width="176" height="176" rx="38" ry="38" fill="url(#bg)"/>

  <!-- Hyperlist tree: one category, two items, two-tab indentation -->
  <g fill="#FFFFFF">
    <!-- Category bar -->
    <rect x="44" y="58" width="104" height="14" rx="5"/>
    <!-- Item 1 (indented) -->
    <rect x="66" y="92" width="82" height="11" rx="4"/>
    <!-- Item 2 (indented) -->
    <rect x="66" y="118" width="68" height="11" rx="4"/>
    <!-- Item 3 (indented) -->
    <rect x="66" y="144" width="58" height="11" rx="4"/>
  </g>

  <!-- Small accent dot on the category, hinting at "active" -->
  <circle cx="139" cy="65" r="4" fill="#FFE3B0"/>
</svg>
